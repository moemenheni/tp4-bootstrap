<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Décalage et centrage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .grid-col {
      border: 1px solid #fd7e14;
      background-color: rgba(253, 126, 20, 0.1);
      padding: 30px 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="container py-4">
    <h1> Centrage par décalage</h1>
    <p class="lead">Une colonne de 4/12 est décalée de 4 colonnes à partir de MD.</p>
    <div class="row">
      <div class="col-md-4 offset-md-4 grid-col">Contenu centré (col-4)</div>
    </div>
  </main>
</body>
</html>
