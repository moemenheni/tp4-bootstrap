<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les 12 colonnes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .grid-col {
      border: 1px solid #0d6efd;
      background-color: rgba(13, 110, 253, 0.1);
      padding: 20px 10px;
      text-align: center;
    }
    .row { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <main class="container py-4">
    <h1> Les 12 colonnes</h1>

    <h2 class="h4 mt-4">Répartition implicite (égale)</h2>
    <div class="row">
      <div class="col grid-col">1/3</div>
      <div class="col grid-col">2/3</div>
      <div class="col grid-col">3/3</div>
    </div>

    <h2 class="h4 mt-4">Répartition explicite (total = 12)</h2>
    <div class="row">
      <div class="col-4 grid-col">4 colonnes</div>
      <div class="col-6 grid-col">6 colonnes</div>
      <div class="col-2 grid-col">2 colonnes</div>
    </div>
  </main>
</body>
</html>
