<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Layout complet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    header, footer, aside, section {
      padding: 24px;
      border: 1px solid #0d6efd;
    }
    header, footer {
      background-color: #0d6efd;
      color: white;
    }
    aside { background-color: rgba(13, 110, 253, 0.1); }
    section { background-color: #f8f9fa; min-height: 240px; }
  </style>
</head>
<body>
  <div class="container-fluid px-0">
    <header class="col-12">
      <h1 class="h3 mb-0">Header - Application Bootstrap</h1>
    </header>

    <main class="row g-0">
      <aside class="col-12 col-md-2">
        <h2 class="h5">Sidebar</h2>
        <p class="mb-0">12/12 sur mobile, 2/12 à partir de MD.</p>
      </aside>
      <section class="col-12 col-md-10">
        <h2 class="h4">Contenu principal</h2>
        <p class="mb-0">12/12 sur mobile, 10/12 à partir de MD.</p>
      </section>
    </main>

    <footer class="col-12">
      <p class="mb-0">Footer - 100% de la largeur</p>
    </footer>
  </div>
</body>
</html>
