<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empilement mobile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .grid-col {
      border: 1px solid #198754;
      background-color: rgba(25, 135, 84, 0.1);
      padding: 30px 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="container py-4">
    <h1> Empilement mobile par défaut</h1>
    <p class="lead">Les colonnes occupent 4/12 à partir de MD et 12/12 sur mobile.</p>
    <div class="row">
      <div class="col-md-4 grid-col">Colonne 1</div>
      <div class="col-md-4 grid-col">Colonne 2</div>
      <div class="col-md-4 grid-col">Colonne 3</div>
    </div>
  </main>
</body>
</html>
